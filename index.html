<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>测测你的中医体质密码</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background-color: #FAF7F2;
      color: #3D3D3D;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ===== Shared ===== */
    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      padding: 24px 20px;
    }

    .page.active {
      display: flex;
    }

    /* ===== Welcome Page ===== */
    .welcome-header {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 60px;
    }

    .welcome-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 32px;
      position: relative;
      background: radial-gradient(circle at 36% 36%, #E8D5B7 0%, #C9A87C 40%, #A67C52 100%);
      box-shadow: 0 8px 32px rgba(166, 124, 82, 0.2);
    }

    .welcome-circle::before {
      content: "脉";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      color: #FFF;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
      font-family: "STKaiti", "KaiTi", "PingFang SC", serif;
    }

    .welcome-circle::after {
      content: "";
      position: absolute;
      width: 136px;
      height: 136px;
      top: -8px;
      left: -8px;
      border-radius: 50%;
      border: 2px dashed rgba(166, 124, 82, 0.25);
      animation: spin-slow 30s linear infinite;
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      color: #3D3D3D;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-align: center;
    }

    .welcome-subtitle {
      font-size: 15px;
      color: #9B8E7E;
      text-align: center;
      line-height: 1.6;
    }

    .welcome-footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-bottom: 24px;
    }

    .btn-start {
      display: block;
      width: 100%;
      max-width: 320px;
      padding: 16px 0;
      background: #3D6B4F;
      color: #FFF;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(61, 107, 79, 0.3);
      -webkit-appearance: none;
      font-family: inherit;
    }

    .btn-start:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(61, 107, 79, 0.25);
    }

    .welcome-disclaimer {
      font-size: 12px;
      color: #C0B5A5;
      text-align: center;
    }

    /* ===== Quiz Page ===== */
    .quiz-progress-wrap {
      width: 100%;
      margin-bottom: 32px;
    }

    .quiz-progress-text {
      font-size: 13px;
      color: #9B8E7E;
      margin-bottom: 8px;
      text-align: center;
    }

    .quiz-progress-bar {
      width: 100%;
      height: 4px;
      background: #E8E0D5;
      border-radius: 2px;
      overflow: hidden;
    }

    .quiz-progress-fill {
      height: 100%;
      background: #3D6B4F;
      border-radius: 2px;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-card {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .quiz-number-bg {
      font-size: 80px;
      font-weight: 800;
      color: rgba(61, 107, 79, 0.06);
      line-height: 1;
      margin-bottom: -20px;
      letter-spacing: -2px;
      pointer-events: none;
    }

    .quiz-question {
      font-size: 20px;
      font-weight: 600;
      color: #3D3D3D;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 36px;
      padding: 0 8px;
    }

    .quiz-options {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .quiz-option {
      width: 100%;
      padding: 16px 20px;
      background: #FFF;
      border: 1.5px solid #E8E0D5;
      border-radius: 14px;
      font-size: 16px;
      color: #3D3D3D;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      -webkit-appearance: none;
      position: relative;
      overflow: hidden;
      line-height: 1.5;
    }

    .quiz-option::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #3D6B4F;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      border-radius: 14px;
    }

    .quiz-option:active {
      transform: scale(0.97);
      border-color: #3D6B4F;
    }

    .quiz-option:active::after {
      opacity: 0.04;
    }

    .quiz-fade-out {
      opacity: 0;
      transform: translateX(-20px);
      transition: opacity 0.25s, transform 0.25s;
    }

    .quiz-fade-in {
      animation: fadeInUp 0.35s ease forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* ===== Result Page ===== */
    .result-card-wrapper {
      width: 100%;
      padding: 0;
    }

    .result-card {
      width: 100%;
      background: #FFF;
      border-radius: 16px;
      padding: 32px 24px 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      position: relative;
      overflow: hidden;
    }

    /* Decorative border via pseudo-elements */
    .result-card::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 10px;
      pointer-events: none;
      z-index: 1;
    }

    /* Corner ornaments */
    .result-corner {
      position: absolute;
      width: 36px;
      height: 36px;
      z-index: 2;
      pointer-events: none;
    }

    .result-corner::before,
    .result-corner::after {
      content: "";
      position: absolute;
      background: var(--con-color, #3D6B4F);
      border-radius: 2px;
      opacity: 0.25;
    }

    .result-corner::before {
      width: 18px;
      height: 2px;
      top: 0;
      left: 0;
    }

    .result-corner::after {
      width: 2px;
      height: 18px;
      top: 0;
      left: 0;
    }

    .result-corner-tl { top: 16px; left: 16px; }
    .result-corner-tr { top: 16px; right: 16px; transform: rotate(90deg); }
    .result-corner-bl { bottom: 16px; left: 16px; transform: rotate(-90deg); }
    .result-corner-br { bottom: 16px; right: 16px; transform: rotate(180deg); }

    .result-inner {
      position: relative;
      z-index: 3;
    }

    .result-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .result-emoji {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .result-name {
      font-size: 32px;
      font-weight: 700;
      color: var(--con-color, #3D6B4F);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .result-nickname {
      font-size: 14px;
      color: #9B8E7E;
      background: #FAF7F2;
      padding: 4px 16px;
      border-radius: 20px;
    }

    .result-divider {
      width: 48px;
      height: 3px;
      background: var(--con-color, #3D6B4F);
      border-radius: 2px;
      margin: 20px auto;
      opacity: 0.6;
    }

    .result-section-title {
      font-size: 14px;
      color: #9B8E7E;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-align: center;
    }

    .result-description {
      list-style: none;
      margin-bottom: 20px;
    }

    .result-description li {
      position: relative;
      padding-left: 18px;
      font-size: 15px;
      line-height: 1.7;
      color: #5A5A5A;
      margin-bottom: 8px;
    }

    .result-description li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--con-color, #3D6B4F);
      opacity: 0.5;
    }

    .result-suggestions {
      list-style: none;
      margin-bottom: 24px;
    }

    .result-suggestions li {
      position: relative;
      padding-left: 24px;
      font-size: 15px;
      line-height: 1.7;
      color: #5A5A5A;
      margin-bottom: 8px;
    }

    .result-suggestions li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--con-color, #3D6B4F);
      opacity: 0.12;
    }

    .result-suggestions li::after {
      content: "🌿";
      position: absolute;
      left: 1px;
      top: 5px;
      font-size: 10px;
    }

    .result-share-hint {
      text-align: center;
      font-size: 13px;
      color: #B0A595;
      padding: 16px 0 4px;
      border-top: 1px dashed #E8E0D5;
      margin-top: 8px;
      line-height: 1.6;
    }

    .result-share-hint span {
      color: var(--con-color, #3D6B4F);
      font-weight: 600;
    }

    /* Result page buttons */
    .result-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
      padding-bottom: 24px;
    }

    .btn-save {
      display: block;
      width: 100%;
      padding: 16px 0;
      background: var(--con-color, #3D6B4F);
      color: #FFF;
      border: none;
      border-radius: 50px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      font-family: inherit;
      -webkit-appearance: none;
    }

    .btn-save:active {
      transform: scale(0.96);
    }

    .btn-retest {
      display: block;
      width: 100%;
      padding: 14px 0;
      background: transparent;
      color: #9B8E7E;
      border: 1px solid #E0D8CB;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      -webkit-appearance: none;
    }

    .btn-retest:active {
      background: #F5F0E8;
      border-color: #C0B5A5;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(0, 0, 0, 0.78);
      color: #FFF;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 15px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ===== Save image overlay ===== */
    .save-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .save-overlay.active {
      display: flex;
    }

    .save-overlay img {
      max-width: 90vw;
      max-height: 75vh;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    .save-overlay-hint {
      color: #FFF;
      font-size: 14px;
      margin-top: 20px;
      text-align: center;
      line-height: 1.6;
      opacity: 0.8;
    }

    .save-overlay-close {
      color: #FFF;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 10px 32px;
      border-radius: 50px;
      font-size: 15px;
      margin-top: 20px;
      cursor: pointer;
      font-family: inherit;
      -webkit-appearance: none;
    }

    /* Logo watermark on result card */
    .result-watermark {
      text-align: center;
      font-size: 12px;
      color: #C5BBA8;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    /* Off-screen canvas for html2canvas */
    .offscreen {
      position: absolute;
      left: -9999px;
      top: 0;
    }
  </style>
</head>
<body>

  <!-- ==================== Welcome Page ==================== -->
  <div class="page active" id="page-welcome">
    <div class="welcome-header">
      <div class="welcome-circle"></div>
      <h1 class="welcome-title">测测你的体质密码</h1>
      <p class="welcome-subtitle">10个问题，揭开你的中医体质密码</p>
    </div>
    <div class="welcome-footer">
      <button class="btn-start" onclick="startQuiz()">开 始 测 试</button>
      <p class="welcome-disclaimer">本测试基于王琦九种体质学说 · 仅供参考</p>
    </div>
  </div>

  <!-- ==================== Quiz Page ==================== -->
  <div class="page" id="page-quiz">
    <div class="quiz-progress-wrap">
      <div class="quiz-progress-text">第 <span id="current-num">1</span> / 10 题</div>
      <div class="quiz-progress-bar">
        <div class="quiz-progress-fill" id="progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <div class="quiz-card" id="quiz-card">
      <div class="quiz-number-bg" id="quiz-number-bg">01</div>
      <div class="quiz-question" id="quiz-question"></div>
      <div class="quiz-options" id="quiz-options"></div>
    </div>
  </div>

  <!-- ==================== Result Page ==================== -->
  <div class="page" id="page-result">
    <div class="result-card-wrapper">
      <div class="result-card" id="result-card">
        <div class="result-corner result-corner-tl" style="--con-color: #3D6B4F;"></div>
        <div class="result-corner result-corner-tr" style="--con-color: #3D6B4F;"></div>
        <div class="result-corner result-corner-bl" style="--con-color: #3D6B4F;"></div>
        <div class="result-corner result-corner-br" style="--con-color: #3D6B4F;"></div>

        <div class="result-inner" id="result-inner">
          <div class="result-header">
            <div class="result-emoji" id="result-emoji"></div>
            <div class="result-name" id="result-name"></div>
            <div class="result-nickname" id="result-nickname"></div>
          </div>

          <div class="result-divider"></div>

          <div class="result-section-title">体 质 特 征</div>
          <ul class="result-description" id="result-description"></ul>

          <div class="result-section-title">调 理 建 议</div>
          <ul class="result-suggestions" id="result-suggestions"></ul>

          <div class="result-share-hint" id="result-share-hint"></div>
          <div class="result-watermark">中医体质测试</div>
        </div>
      </div>
    </div>

    <div class="result-actions">
      <button class="btn-save" id="btn-save" onclick="saveResult()">保 存 图 片</button>
      <button class="btn-retest" onclick="retest()">再 测 一 次</button>
    </div>
  </div>

  <!-- ==================== Save Image Overlay ==================== -->
  <div class="save-overlay" id="save-overlay" onclick="closeSaveOverlay(event)">
    <img id="save-overlay-img" src="" alt="体质测试结果" />
    <p class="save-overlay-hint">👆 长按图片即可保存到相册</p>
    <button class="save-overlay-close" onclick="closeSaveOverlay()">关 闭</button>
  </div>

  <!-- ==================== Toast ==================== -->
  <div class="toast" id="toast"></div>

  <script>
    // ==================== Data ====================
    const questions = [
      {
        id: 1,
        text: "你平时的精力状态是？",
        dimension: "精力",
        options: [
          { text: "精力充沛，很少觉得累", scores: { pinghe: 2 } },
          { text: "容易疲倦，总想躺着", scores: { qixu: 2, yangxu: 1 } },
          { text: "时好时坏，下午容易犯困", scores: { qixu: 1, tanshi: 1 } }
        ]
      },
      {
        id: 2,
        text: "你对冷热的感受？",
        dimension: "寒热",
        options: [
          { text: "特别怕冷，手脚总是凉的", scores: { yangxu: 2 } },
          { text: "容易上火、怕热、爱喝冷饮", scores: { yinxu: 1, shire: 1 } },
          { text: "冷热都还好，适应能力强", scores: { pinghe: 2 } }
        ]
      },
      {
        id: 3,
        text: "关于出汗，你更符合哪种？",
        dimension: "出汗",
        options: [
          { text: "动一动就大汗淋漓", scores: { qixu: 2 } },
          { text: "晚上睡觉偷偷出汗（盗汗）", scores: { yinxu: 2 } },
          { text: "出汗正常，不多不少", scores: { pinghe: 2 } }
        ]
      },
      {
        id: 4,
        text: "你的嘴巴状态？",
        dimension: "口腔",
        options: [
          { text: "经常口干，特别想喝水", scores: { yinxu: 2 } },
          { text: "嘴里黏腻，有时有异味", scores: { tanshi: 1, shire: 1 } },
          { text: "没什么特别感觉", scores: { pinghe: 2 } }
        ]
      },
      {
        id: 5,
        text: "你的体型特点？",
        dimension: "体型",
        options: [
          { text: "偏胖，肉软乎乎不结实", scores: { tanshi: 2, qixu: 1 } },
          { text: "偏瘦，怎么吃都长不胖", scores: { yinxu: 1, qixu: 1 } },
          { text: "体型匀称，不胖不瘦", scores: { pinghe: 2 } }
        ]
      },
      {
        id: 6,
        text: "你的睡眠质量怎么样？",
        dimension: "睡眠",
        options: [
          { text: "难入睡，脑子停不下来", scores: { qiyu: 2, yinxu: 1 } },
          { text: "睡多少都不够，白天还困", scores: { qixu: 1, yangxu: 1, tanshi: 1 } },
          { text: "睡眠还不错，倒头就睡", scores: { pinghe: 2 } }
        ]
      },
      {
        id: 7,
        text: "你的大便情况（认真回答，这很关键）？",
        dimension: "大便",
        options: [
          { text: "偏软偏烂，容易粘马桶", scores: { tanshi: 2, shire: 1 } },
          { text: "偏干，费劲，好几天一次", scores: { yinxu: 1, xueyou: 1 } },
          { text: "规律正常，成形不费力", scores: { pinghe: 2 } }
        ]
      },
      {
        id: 8,
        text: "你的皮肤和脸色？",
        dimension: "皮肤",
        options: [
          { text: "容易长痘、出油，脸总油光光", scores: { shire: 2 } },
          { text: "面色暗沉、嘴唇偏暗，有色斑", scores: { xueyou: 2 } },
          { text: "肤色红润，皮肤状态不错", scores: { pinghe: 2 } }
        ]
      },
      {
        id: 9,
        text: "你平时的情绪状态？",
        dimension: "情绪",
        options: [
          { text: "容易焦虑、烦闷，叹气多", scores: { qiyu: 2 } },
          { text: "情绪稳定，比较想得开", scores: { pinghe: 2 } },
          { text: "容易敏感，在意别人看法", scores: { qiyu: 1, tebing: 1 } }
        ]
      },
      {
        id: 10,
        text: "你有没有这些情况？",
        dimension: "过敏",
        options: [
          { text: "过敏体质，容易起疹子/鼻炎/哮喘", scores: { tebing: 2 } },
          { text: "身体皮实，基本不过敏", scores: { pinghe: 2 } },
          { text: "偶尔有点，但不严重", scores: { tebing: 1 } }
        ]
      }
    ];

    const constitutions = {
      pinghe: {
        name: "平和质",
        nickname: "天选打工人型",
        color: "#4CAF82",
        emoji: "🌿",
        description: [
          "身体底子好，精力充沛，很少生病",
          "睡得香、吃得下、心态稳，是大家羡慕的体质",
          "适应能力强，不怎么挑食，冷热都扛得住"
        ],

    // ==================== State ====================
    let answers = [];
    let currentIndex = 0;
    let isTransitioning = false;

    // ==================== Navigation ====================
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    // ==================== Toast ====================
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (toastTimer) clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
        toastTimer = null;
      }, 2000);
    }

    // ==================== Quiz ====================
    function startQuiz() {
      answers = [];
      currentIndex = 0;
      showPage('page-quiz');
      renderQuestion();
      // Scroll to top
      window.scrollTo(0, 0);
    }

    function renderQuestion() {
      if (currentIndex >= questions.length) {
        finishQuiz();
        return;
      }

      const q = questions[currentIndex];
      const numStr = String(currentIndex + 1).padStart(2, '0');

      document.getElementById('current-num').textContent = currentIndex + 1;
      document.getElementById('progress-fill').style.width = ((currentIndex) / questions.length * 100) + '%';
      document.getElementById('quiz-number-bg').textContent = numStr;
      document.getElementById('quiz-question').textContent = q.text;

      const optionsContainer = document.getElementById('quiz-options');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.textContent = opt.text;
        btn.addEventListener('click', () => selectOption(idx));
        // Slight stagger on entry
        btn.style.opacity = '0';
        btn.style.transform = 'translateY(10px)';
        btn.style.transition = 'opacity 0.3s ease ' + (idx * 0.06) + 's, transform 0.3s ease ' + (idx * 0.06) + 's';
        optionsContainer.appendChild(btn);

        // Trigger stagger
        requestAnimationFrame(() => {
          btn.style.opacity = '1';
          btn.style.transform = 'translateY(0)';
        });
      });
    }

    function selectOption(optionIndex) {
      if (isTransitioning) return;
      isTransitioning = true;

      const q = questions[currentIndex];
      const selected = q.options[optionIndex];
      answers.push({ questionId: q.id, scores: selected.scores });

      currentIndex++;

      // Animate progress bar
      document.getElementById('progress-fill').style.width = ((currentIndex) / questions.length * 100) + '%';

      if (currentIndex >= questions.length) {
        // Small delay to let progress bar animate, then show result
        setTimeout(() => {
          finishQuiz();
          isTransitioning = false;
        }, 350);
        return;
      }

      // Fade out current card
      const quizCard = document.getElementById('quiz-card');
      quizCard.classList.add('quiz-fade-out');

      setTimeout(() => {
        renderQuestion();
        quizCard.classList.remove('quiz-fade-out');
        quizCard.classList.add('quiz-fade-in');
        setTimeout(() => {
          quizCard.classList.remove('quiz-fade-in');
          isTransitioning = false;
        }, 350);
      }, 250);
    }

    // ==================== Calculate Result ====================
    function calculateConstitution() {
      const totalScores = {
        pinghe: 0, qixu: 0, yangxu: 0, yinxu: 0,
        tanshi: 0, shire: 0, xueyou: 0, qiyu: 0, tebing: 0
      };

      answers.forEach(answer => {
        Object.entries(answer.scores).forEach(([key, val]) => {
          totalScores[key] += val;
        });
      });

      // Pinghe special handling
      const nonPinghe = Object.entries(totalScores)
        .filter(([k]) => k !== 'pinghe')
        .map(([, v]) => v);
      const maxOther = Math.max(...nonPinghe);

      if (totalScores.pinghe >= 8 && maxOther <= 3) {
        return 'pinghe';
      }

      // Return highest scoring constitution (excluding pinghe)
      delete totalScores.pinghe;
      return Object.entries(totalScores).sort((a, b) => b[1] - a[1])[0][0];
    }

    function finishQuiz() {
      const key = calculateConstitution();
      const con = constitutions[key];

      // Update result card with constitution color
      const resultCard = document.getElementById('result-card');
      resultCard.style.setProperty('--con-color', con.color);

      // Update corner ornaments
      document.querySelectorAll('.result-corner').forEach(c => {
        c.style.setProperty('--con-color', con.color);
      });

      // Update buttons
      document.getElementById('btn-save').style.setProperty('--con-color', con.color);

      // Fill in content
      document.getElementById('result-emoji').textContent = con.emoji;
      document.getElementById('result-name').textContent = con.name;
      document.getElementById('result-name').style.setProperty('--con-color', con.color);
      document.getElementById('result-nickname').textContent = con.nickname;

      // Divider
      document.querySelector('#result-inner .result-divider').style.setProperty('--con-color', con.color);

      // Description
      const descList = document.getElementById('result-description');
      descList.innerHTML = con.description.map(d => `<li>${d}</li>`).join('');

      // Suggestions
      const suggList = document.getElementById('result-suggestions');
      suggList.innerHTML = con.suggestions.map(s => `<li>${s}</li>`).join('');

      // Share hint
      document.getElementById('result-share-hint').innerHTML =
        `「我测出来是<span>${con.name}</span>，你是哪种？」<br>👆 点击右上角分享给朋友`;

      // Show result page
      showPage('page-result');
      window.scrollTo(0, 0);
    }

    function retest() {
      answers = [];
      currentIndex = 0;
      showPage('page-welcome');
      window.scrollTo(0, 0);
    }

    // ==================== Save Image ====================
    async function saveResult() {
      const resultCard = document.getElementById('result-card');
      const btnSave = document.getElementById('btn-save');

      // Show loading state
      const originalText = btnSave.textContent;
      btnSave.textContent = '正在生成图片…';
      btnSave.style.opacity = '0.7';
      btnSave.disabled = true;

      try {
        // Use html2canvas to capture the result card
        const canvas = await html2canvas(resultCard, {
          scale: 2,
          backgroundColor: '#FFFFFF',
          useCORS: true,
          logging: false,
          allowTaint: true
        });

        const imgDataUrl = canvas.toDataURL('image/png');

        // Show overlay with the image
        const overlay = document.getElementById('save-overlay');
        const overlayImg = document.getElementById('save-overlay-img');
        overlayImg.src = imgDataUrl;
        overlay.classList.add('active');

        // Prevent body scroll
        document.body.style.overflow = 'hidden';

        showToast('✅ 长按图片即可保存');
      } catch (err) {
        console.error('html2canvas error:', err);

        // Fallback: show the result card directly and prompt screenshot
        showToast('生成图片失败，请直接截图保存');
      } finally {
        btnSave.textContent = originalText;
        btnSave.style.opacity = '1';
        btnSave.disabled = false;
      }
    }

    function closeSaveOverlay(event) {
      // Only close if clicking the overlay background or close button (not the image)
      if (event && event.target.tagName === 'IMG') return;

      const overlay = document.getElementById('save-overlay');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    // ==================== Init ====================
    // Preload html2canvas availability check
    if (typeof html2canvas === 'undefined') {
      console.warn('html2canvas not loaded yet, save image feature may not work');
    }

    // Ensure initial page is shown
    showPage('page-welcome');
  </script>
